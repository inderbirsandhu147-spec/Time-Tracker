<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timers">
<meta name="theme-color" content="#0e0f12">
<title>Timers</title>
<style>
:root{
  --bg:#eceef2; --ink:#14161a; --muted:#5d6470; --sheet:#fff; --line:#d5d9e0; --field:#f3f4f7;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0e0f12;--ink:#f3f4f6;--muted:#9aa1ad;--sheet:#1b1d22;--line:#2d3038;--field:#262930;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0e0f12;--ink:#f3f4f6;--muted:#9aa1ad;--sheet:#1b1d22;--line:#2d3038;--field:#262930;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  -webkit-user-select:none;user-select:none}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:baseline;justify-content:space-between;margin:8px 4px 18px}
h1{margin:0;font-size:32px;font-weight:800;letter-spacing:-.02em}
.total{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.total b{color:var(--ink);font-weight:700}
.list{display:grid;gap:14px}
.tile{position:relative;border-radius:26px;padding:18px 18px 16px;color:#fff;background:var(--c);
  transition:box-shadow .2s,transform .2s}
.tile.run{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--c)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.name{font-size:20px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#fff;flex:none;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.time{font-size:62px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:10px 0 14px;font-variant-numeric:tabular-nums}
.bar{display:flex;align-items:center;justify-content:space-between}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.ghost{background:rgba(255,255,255,.2);border-radius:99px;padding:11px 18px;font-size:16px;font-weight:600;min-height:44px}
.ghost.armed{background:#fff;color:#111}
.edit{background:rgba(255,255,255,.2);border-radius:50%;width:44px;height:44px;display:grid;place-items:center;flex:none}
.play{width:64px;height:64px;border-radius:50%;background:#fff;color:var(--c);display:grid;place-items:center}
.play:active{transform:scale(.94)}
svg{display:block}
.add{width:100%;margin-top:6px;padding:17px;border-radius:22px;border:2px dashed var(--line);background:transparent;
  color:var(--muted);font-size:17px;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:34px 20px 10px;line-height:1.5;font-size:16px}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.veil.on{display:flex}
.sheet{width:100%;max-width:560px;background:var(--sheet);border-radius:28px 28px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 16px;font-size:22px}
input[type=text]{width:100%;font:inherit;font-size:17px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);
  background:var(--field);color:var(--ink);-webkit-user-select:text;user-select:text;outline:none}
input[type=text]:focus-visible{border-color:var(--ink)}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.sw button{aspect-ratio:1.5;border-radius:16px;background:var(--c);position:relative}
.sw button[aria-pressed=true]::after{content:"";position:absolute;inset:-5px;border-radius:20px;border:3px solid var(--ink)}
.row{display:flex;gap:10px}
.row button{flex:1;padding:15px;border-radius:16px;font-size:17px;font-weight:700;background:var(--field)}
.row .save{background:var(--ink);color:var(--bg)}
.del{width:100%;margin-top:10px;padding:14px;border-radius:16px;background:transparent;color:#d9453b;font-size:16px;font-weight:700}
.del.armed{background:#d9453b;color:#fff}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.dot{animation:none}.tile{transition:none}}
</style>
</head>
<body>
<main>
  <header><h1>Timers</h1><div class="total">Total <b id="total">00:00</b></div></header>
  <div id="list" class="list"></div>
  <button class="add" id="addBtn">Add timer</button>
</main>

<div class="veil" id="veil">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <h2 id="sTitle">New timer</h2>
    <input type="text" id="nameIn" maxlength="40" placeholder="Name, for example Studying" autocomplete="off" autocapitalize="sentences">
    <div class="sw" id="sw"></div>
    <div class="row"><button id="cancel">Cancel</button><button class="save" id="save">Save</button></div>
    <button class="del" id="del" hidden>Delete timer</button>
  </div>
</div>

<script>
var KEY="time-tracker-v1";
var COLORS=["#d9453b","#c95f12","#2e8b57","#0f8b8d","#2f6fde","#5b54d6","#9b4dca","#d43c86"];
var tasks=[];
try{tasks=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){tasks=[]}
if(!Array.isArray(tasks))tasks=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function ms(t){return t.elapsed+(t.startedAt?Date.now()-t.startedAt:0)}
function p(n){return String(n).padStart(2,"0")}
function fmt(v){var s=Math.floor(v/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);s%=60;
  return h?h+":"+p(m)+":"+p(s):p(m)+":"+p(s)}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

var PLAY='<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
var PAUSE='<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.5" height="14" rx="1.4"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.4"/></svg>';
var DOTS='<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';

var armedReset=null,armTimer=null;
var listEl=document.getElementById("list");

function render(){
  if(!tasks.length){
    listEl.innerHTML='<div class="empty">No timers yet.<br>Add one for something you want to track, like Studying or Reading.</div>';
  }else{
    listEl.innerHTML=tasks.map(function(t){
      var run=!!t.startedAt;
      return '<section class="tile'+(run?' run':'')+'" style="--c:'+t.color+'" data-id="'+t.id+'">'+
        '<div class="top"><div class="name">'+(run?'<span class="dot"></span>':'')+'<span>'+esc(t.name)+'</span></div>'+
        '<button class="edit" data-act="edit" aria-label="Edit '+esc(t.name)+'">'+DOTS+'</button></div>'+
        '<div class="time" data-time="'+t.id+'">'+fmt(ms(t))+'</div>'+
        '<div class="bar"><button class="ghost'+(armedReset===t.id?' armed':'')+'" data-act="reset">'+(armedReset===t.id?'Tap to confirm':'Reset')+'</button>'+
        '<button class="play" data-act="toggle" aria-label="'+(run?'Pause':'Start')+' '+esc(t.name)+'">'+(run?PAUSE:PLAY)+'</button></div>'+
        '</section>';
    }).join("");
  }
  tick();
}
function tick(){
  var sum=0;
  tasks.forEach(function(t){
    var v=ms(t);sum+=v;
    var el=listEl.querySelector('[data-time="'+t.id+'"]');
    if(el){var s=fmt(v);if(el.textContent!==s)el.textContent=s}
  });
  document.getElementById("total").textContent=fmt(sum);
}
setInterval(tick,250);
document.addEventListener("visibilitychange",tick);

listEl.addEventListener("click",function(e){
  var b=e.target.closest("button[data-act]");if(!b)return;
  var id=b.closest(".tile").dataset.id;
  var t=tasks.find(function(x){return x.id===id});if(!t)return;
  var act=b.dataset.act;
  if(act==="toggle"){
    if(t.startedAt){t.elapsed+=Date.now()-t.startedAt;t.startedAt=null}
    else t.startedAt=Date.now();
    save();render();
  }else if(act==="reset"){
    if(ms(t)===0)return;
    if(armedReset===id){
      t.elapsed=0;if(t.startedAt)t.startedAt=Date.now();
      armedReset=null;clearTimeout(armTimer);save();render();
    }else{
      armedReset=id;clearTimeout(armTimer);
      armTimer=setTimeout(function(){armedReset=null;render()},3000);
      render();
    }
  }else if(act==="edit"){openSheet(t)}
});

/* Sheet */
var veil=document.getElementById("veil"),nameIn=document.getElementById("nameIn"),
    swEl=document.getElementById("sw"),delBtn=document.getElementById("del"),
    editing=null,pick=COLORS[0],delArmed=false;

function drawSwatches(){
  swEl.innerHTML=COLORS.map(function(c){
    return '<button style="--c:'+c+'" data-c="'+c+'" aria-label="Colour '+c+'" aria-pressed="'+(c===pick)+'"></button>';
  }).join("");
}
function openSheet(t){
  editing=t||null;delArmed=false;
  document.getElementById("sTitle").textContent=t?"Edit timer":"New timer";
  nameIn.value=t?t.name:"";
  pick=t?t.color:COLORS[tasks.length%COLORS.length];
  delBtn.hidden=!t;delBtn.classList.remove("armed");delBtn.textContent="Delete timer";
  drawSwatches();veil.classList.add("on");
  if(!t)setTimeout(function(){nameIn.focus()},50);
}
function closeSheet(){veil.classList.remove("on");nameIn.blur()}
swEl.addEventListener("click",function(e){var b=e.target.closest("button[data-c]");if(b){pick=b.dataset.c;drawSwatches()}});
document.getElementById("addBtn").addEventListener("click",function(){openSheet(null)});
document.getElementById("cancel").addEventListener("click",closeSheet);
veil.addEventListener("click",function(e){if(e.target===veil)closeSheet()});
function commit(){
  var n=nameIn.value.trim();
  if(!n){nameIn.focus();return}
  if(editing){editing.name=n;editing.color=pick}
  else tasks.push({id:uid(),name:n,color:pick,elapsed:0,startedAt:null});
  save();closeSheet();render();
}
document.getElementById("save").addEventListener("click",commit);
nameIn.addEventListener("keydown",function(e){if(e.key==="Enter")commit()});
delBtn.addEventListener("click",function(){
  if(!delArmed){delArmed=true;delBtn.classList.add("armed");delBtn.textContent="Tap again to delete";return}
  tasks=tasks.filter(function(x){return x!==editing});
  save();closeSheet();render();
});

render();
</script>
</body>
</html>
